name: Prepare LinkedIn Update

on:
  push:
    branches:
      - main

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        run: |
          # 1. Fetch upstream to locate the exact fork divergence point
          git remote add upstream https://github.com/sib-swiss/intro-spatial-transcriptomics-training.git || true
          git fetch upstream main --quiet

          # 2. Find the common ancestor between upstream and your repository
          FORK_POINT=$(git merge-base upstream/main HEAD)

          # 3. Log ALL commits made in your fork since diverging from upstream
          COMMITS=$(git log ${FORK_POINT}..HEAD --pretty=format:"• %s" --no-merges)

          # Fallback if no commits were found
          if [ -z "$COMMITS" ]; then
            COMMITS="• ${{ github.event.head_commit.message }}"
          fi

          echo "### 🚀 Copy this to your LinkedIn comment: ###" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "$COMMITS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "https://github.com/${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
