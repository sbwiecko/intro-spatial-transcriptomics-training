name: Prepare LinkedIn Update

on:
  push:
    branches:
      - main

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        run: |
          # 1. Add upstream reference to detect the fork point
          git remote add upstream https://github.com/sib-swiss/intro-spatial-transcriptomics-training.git || true
          git fetch upstream main --quiet

          # 2. Find the point where this fork diverged from upstream
          FORK_POINT=$(git merge-base upstream/main HEAD)

          BEFORE="${{ github.event.before }}"

          # 3. Determine commit range for this push, bounded by the fork point
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # Fresh push: list commits made in this repo since the fork point
            COMMITS=$(git log ${FORK_POINT}..${{ github.sha }} --pretty=format:"• %s" --no-merges)
          else
            # Incremental push: list commits between previous push and now, excluding anything before fork
            COMMITS=$(git log ${FORK_POINT}..${{ github.sha }} --pretty=format:"• %s" "$BEFORE..${{ github.sha }}" --no-merges)
          fi

          # Fallback if no commits were found in range
          if [ -z "$COMMITS" ]; then
            COMMITS="• ${{ github.event.head_commit.message }}"
          fi

          echo "### 🚀 Copy this to your LinkedIn comment: ###" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "$COMMITS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "https://github.com/${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
